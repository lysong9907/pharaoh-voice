<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharaoh Voice — Elite Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ====== Background ambient ====== -->
  <div class="bg-ambient">
    <div class="bg-pyramid pyramid-1"></div>
    <div class="bg-pyramid pyramid-2"></div>
    <div class="bg-pyramid pyramid-3"></div>
    <div class="bg-stars"></div>
    <div class="bg-glow"></div>
  </div>

  <!-- ====== Language Switcher ====== -->
  <div class="lang-switcher">
    <button class="lang-btn" data-lang="en" title="English">EN</button>
    <button class="lang-btn" data-lang="ar" title="العربية">ع</button>
  </div>

  <!-- ====== Join Screen ====== -->
  <div id="join-screen" class="screen">
    <div class="join-card glass-gold">
      <!-- Eye of Horus Logo -->
      <div class="logo-wrap">
        <svg class="logo-horus" viewBox="0 0 120 80" fill="none">
          <!-- Stylized Eye of Horus (Wadjet) -->
          <path d="M10 40 C 25 20, 50 15, 70 15 C 90 15, 105 25, 110 40 C 105 55, 90 65, 70 65 C 50 65, 25 60, 10 40 Z" stroke="url(#goldGrad)" stroke-width="2.5" fill="rgba(212,175,55,0.06)"/>
          <circle cx="60" cy="40" r="14" stroke="url(#goldGrad)" stroke-width="2.5" fill="rgba(30,58,138,0.4)"/>
          <circle cx="60" cy="40" r="6" fill="url(#goldGrad)"/>
          <!-- Hieroglyphic markings -->
          <path d="M60 65 L 60 72" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M55 70 Q 60 76, 65 70" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M95 28 L 105 22" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
          <defs>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#f0c75e"/>
              <stop offset="50%" style="stop-color:#d4af37"/>
              <stop offset="100%" style="stop-color:#b8860b"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <h1 class="brand-title" data-i18n="brand">PHARAOH VOICE</h1>
      <p class="brand-subtitle" data-i18n="tagline">Elite Encrypted Voice Chambers</p>

      <div class="input-group">
        <label class="input-label" data-i18n="nameLabel">Your Name</label>
        <input type="text" id="name-input" data-i18n-ph="namePh" maxlength="20" autocomplete="off">
      </div>
      <div class="input-group">
        <label class="input-label" data-i18n="roomLabel">Chamber Name</label>
        <input type="text" id="room-input" data-i18n-ph="roomPh" maxlength="50" autocomplete="off">
      </div>

      <button id="join-btn" class="btn-enter">
        <span data-i18n="enter">Enter Chamber</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>

      <p class="hint-text" data-i18n="hint">Share the chamber link with allies to connect</p>

      <div class="features-row">
        <div class="feature-chip"><span>🎙</span><span data-i18n="featVoice">Voice</span></div>
        <div class="feature-chip"><span>💬</span><span data-i18n="featText">Text</span></div>
        <div class="feature-chip"><span>😀</span><span data-i18n="featEmoji">Emoji</span></div>
      </div>
    </div>
  </div>

  <!-- ====== Chat Room Screen ====== -->
  <div id="chat-screen" class="screen hidden">
    <!-- Top bar -->
    <div class="topbar glass-dark">
      <div class="room-info">
        <span class="ankh-icon">☥</span>
        <span id="room-name-display" class="room-name"></span>
        <span class="user-count" id="user-count">1</span>
      </div>
      <div class="topbar-actions">
        <button id="copy-link-btn" class="btn-icon" data-i18n-title="copyLink">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </button>
        <button id="leave-btn" class="btn-icon btn-leave" data-i18n-title="leave">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>

    <!-- Connection status indicator -->
    <div id="conn-status" class="conn-status conn-stable">
      <span class="conn-dot"></span>
      <span class="conn-text" data-i18n="connStable">Connected</span>
    </div>

    <!-- Main area -->
    <div class="main-area">
      <!-- Participants panel -->
      <div class="participants-panel glass-dark">
        <h3 class="panel-title" data-i18n="participants">Members</h3>
        <div id="participants-list"></div>
      </div>

      <!-- Chat panel -->
      <div class="chat-panel">
        <div id="chat-messages" class="chat-messages"></div>

        <!-- Emoji picker -->
        <div id="emoji-picker" class="emoji-picker glass-dark hidden">
          <div class="emoji-grid" id="emoji-grid"></div>
        </div>

        <!-- Input area -->
        <div class="chat-input-area glass-dark">
          <button id="emoji-btn" class="btn-icon" data-i18n-title="emoji">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          </button>
          <input type="text" id="message-input" data-i18n-ph="msgPh" maxlength="500" autocomplete="off">
          <button id="send-btn" class="btn-send" data-i18n-title="send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Bottom: mic control -->
    <div class="bottom-bar glass-dark">
      <button id="mic-toggle" class="mic-btn mic-off">
        <svg class="mic-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        <span class="mic-label" data-i18n="micOn">Unmute</span>
      </button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
